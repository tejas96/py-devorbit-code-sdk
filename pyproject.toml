[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "devorbit-multi-llm-sdk"
version = "0.1.0"
description = "A unified Python SDK for multiple LLM providers with Claude SDK-like interface"
authors = ["Devorbit Team"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/devorbit/devorbit-multi-llm-sdk"
repository = "https://github.com/devorbit/devorbit-multi-llm-sdk"
documentation = "https://github.com/devorbit/devorbit-multi-llm-sdk/blob/main/README.md"
keywords = ["llm", "ai", "sdk", "anthropic", "openai", "gemini", "mistral"]
packages = [{include = "devorbit", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
httpx = ">=0.27.0"
pydantic = ">=2.0.0"
typing-extensions = ">=4.7.0"
anyio = ">=3.5.0,<5"
distro = ">=1.7.0,<2"
sniffio = "*"
# Provider-specific SDKs
anthropic = ">=0.40.0"
openai = ">=1.54.0"
google-generativeai = ">=0.8.0"
mistralai = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-xdist = ">=3.3.0"
mypy = ">=1.5.0"
ruff = ">=0.1.0"
black = ">=23.0.0"
isort = ">=5.12.0"
pre-commit = ">=3.0.0"
bandit = {version = ">=1.7.5", extras = ["toml"]}
safety = ">=2.3.0"
vulture = ">=2.9"
interrogate = ">=1.5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=devorbit --cov-report=term-missing --cov-report=xml --cov-report=html"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
show_error_codes = true
pretty = true
disallow_any_unimported = false
disallow_any_explicit = false
disallow_subclassing_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "S106"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B601"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
fail-under = 80
exclude = ["tests", "docs", ".venv"]
verbose = 2
