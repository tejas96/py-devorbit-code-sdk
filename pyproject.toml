[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devorbit-multi-llm-sdk"
version = "0.1.0"
description = "A unified Python SDK for multiple LLM providers with Claude SDK-like interface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Devorbit Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.7.0",
    "anyio>=3.5.0,<5",
    "distro>=1.7.0,<2",
    "sniffio",
    # Provider-specific SDKs
    "anthropic>=0.40.0",
    "openai>=1.54.0",
    "google-generativeai>=0.8.0",
    "mistralai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://github.com/devorbit/devorbit-multi-llm-sdk"
Documentation = "https://github.com/devorbit/devorbit-multi-llm-sdk/blob/main/README.md"
Repository = "https://github.com/devorbit/devorbit-multi-llm-sdk"
Issues = "https://github.com/devorbit/devorbit-multi-llm-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/devorbit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=devorbit --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
