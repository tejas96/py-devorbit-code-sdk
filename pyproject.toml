[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "devorbit-multi-llm-sdk"
version = "0.1.0"
description = "A unified Python SDK for multiple LLM providers with Claude SDK-like interface"
authors = ["Devorbit Team"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/devorbit/devorbit-multi-llm-sdk"
repository = "https://github.com/devorbit/devorbit-multi-llm-sdk"
documentation = "https://github.com/devorbit/devorbit-multi-llm-sdk/blob/main/README.md"
keywords = ["llm", "ai", "sdk", "anthropic", "openai", "gemini", "mistral"]
packages = [{include = "devorbit", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
httpx = ">=0.27.0"
pydantic = ">=2.0.0"
typing-extensions = ">=4.7.0"
anyio = ">=3.5.0,<5"
distro = ">=1.7.0,<2"
sniffio = "*"
# Provider-specific SDKs
anthropic = ">=0.40.0"
openai = ">=1.54.0"
google-generativeai = ">=0.8.0"
mistralai = ">=1.0.0"
# CLI dependencies (optional, for CLI usage)
rich = {version = ">=13.0.0", optional = true}
prompt-toolkit = {version = ">=3.0.0", optional = true}
click = {version = ">=8.0.0", optional = true}

[tool.poetry.extras]
cli = ["rich", "prompt-toolkit", "click"]

[tool.poetry.scripts]
devorbit = "devorbit.cli.main:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-xdist = ">=3.3.0"
mypy = ">=1.5.0"
ruff = ">=0.1.0"
black = ">=23.0.0"
isort = ">=5.12.0"
pre-commit = ">=3.0.0"
bandit = {version = ">=1.7.5", extras = ["toml"]}
safety = ">=2.3.0"
vulture = ">=2.9"
interrogate = ">=1.5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=devorbit --cov-report=term-missing --cov-report=xml --cov-report=html"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
show_error_codes = true
pretty = true
disallow_any_unimported = false
disallow_any_explicit = false
disallow_subclassing_any = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_concatenate = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "openai.*",
    "tiktoken.*",
    "httpx.*",
    "google.*",
    "google.generativeai.*",
    "google.ai.*",
    "mcp.*",
    "anthropic.*",
    "mistralai.*",
    "prompt_toolkit.*",
    "rich.*",
    "click.*"
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "devorbit.providers.gemini"
disable_error_code = ["attr-defined", "arg-type"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [
    "test_*.py",  # Root test files
    "demo_*.py",  # Root demo files
    "examples/",  # Example scripts
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    # "I", # isort - disabled to use standalone isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "RUF", # ruff-specific rules
]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "S106", "TC001", "RUF012", "PLR0913"]
"__init__.py" = ["F401", "RUF022"]
"examples/*" = ["ERA001", "T201", "S101", "PTH", "B905", "SIM", "PLC0415", "B007", "F401", "RET504", "RUF013", "F841"]
"src/devorbit/_tool_helpers.py" = ["UP047"]
# CLI module intentional patterns
"src/devorbit/cli/**/*.py" = [
    "PLC0415",  # Conditional imports for Rich
    "PLR0911",  # Too many returns
    "PLR0912",  # Too many branches
    "PLR0915",  # Too many statements
    "PLR1714",  # Multiple comparisons
    "SIM102",   # Nested ifs
    "F841",     # Unused variable
    "RUF001",   # Ambiguous unicode
    "RUF002",   # Ambiguous unicode in docstring
    "RUF012",   # ClassVar (fixing critical ones)
]
# Allow unused imports in TYPE_CHECKING
"src/devorbit/cli/input/*.py" = ["F401"]
"src/devorbit/cli/ui/*.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = false
force-sort-within-sections = true
lines-after-imports = 2

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | examples
)/
|^/(test_|demo_).*\.py$
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_after_imports = 2
skip_gitignore = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B601"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
fail-under = 80
exclude = ["tests", "docs", ".venv"]
verbose = 2
